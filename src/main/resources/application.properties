spring.application.name=QuanLySinhVien
spring.datasource.url=jdbc:mysql://localhost:3306/trainingbackend?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.format_sql=true
# Tùy chọn Hibernate để tự động tạo/cập nhật bảng hoặc hiển thị câu lệnh SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

